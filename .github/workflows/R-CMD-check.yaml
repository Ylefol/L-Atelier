# R CMD check (build, documentation, examples, tests) per package.
# HORIZON and GAIA run on Linux, macOS and Windows so that the unit tests run on
# every OS. CAULDRON runs on Linux only for now.
# Only hard dependencies (Depends/Imports) are installed, plus testthat, so GAIA's
# long Suggests list does not have to build for every check.
name: R-CMD-check

on:
  push:
    branches: [master, dev]   # NOTE: 'dev' is temporary while CI is being set up. Remove before the final merge to master.
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  check:
    runs-on: ${{ matrix.config.os }}
    name: check ${{ matrix.package }} (${{ matrix.config.os }}, R ${{ matrix.config.r }})
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        package: [HORIZON, GAIA]
        config:
          - {os: ubuntu-latest, r: release}
          - {os: macos-latest, r: release}
          - {os: windows-latest, r: release}
        include:
          - package: CAULDRON
            config: {os: ubuntu-latest, r: release}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # pak (used by setup-r-dependencies) otherwise resolves Bioconductor against
      # the previous release (3.23) for a while after a new one ships. Policy: test
      # the CURRENT Bioconductor release. Bump this at each Bioconductor release.
      R_BIOC_VERSION: "3.24"

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: ${{ matrix.package }}
          # GAIA's tests use limma, sva and mice (Suggests); without them 10-14 tests skip silently.
          extra-packages: any::rcmdcheck, any::testthat${{ matrix.package == 'GAIA' && ', any::limma, any::sva, any::mice' || '' }}
          dependencies: '"hard"'
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: ${{ matrix.package }}
          # All three packages are clean (Status: OK), so a new WARNING fails the job.
          # NOTEs are still printed in the log but do not fail it.
          error-on: '"warning"'
          upload-snapshots: true
