# R CMD check (build, documentation, examples, tests) per package.
# HORIZON, GAIA and CAULDRON, Linux only. Widen the OS matrix once these are green.
# Only hard dependencies (Depends/Imports) are installed, plus testthat, so GAIA's
# long Suggests list does not have to build for every check.
name: R-CMD-check

on:
  push:
    branches: [master, dev]   # NOTE: 'dev' is temporary while CI is being set up. Remove before the final merge to master.
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  check:
    runs-on: ${{ matrix.config.os }}
    name: check ${{ matrix.package }} (${{ matrix.config.os }}, R ${{ matrix.config.r }})
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        package: [HORIZON, GAIA, CAULDRON]
        config:
          - {os: ubuntu-latest, r: release}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: ${{ matrix.package }}
          extra-packages: any::rcmdcheck, any::testthat
          dependencies: '"hard"'
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: ${{ matrix.package }}
          # All three packages are clean (Status: OK), so a new WARNING fails the job.
          # NOTEs are still printed in the log but do not fail it.
          error-on: '"warning"'
          upload-snapshots: true
