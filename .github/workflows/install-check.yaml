# Tests the documented install path (install.R) on a blank machine per OS.
# This is the closest thing to "what happens for a new user". After installing,
# it runs the cross-package integration tests (tests/integration) against the
# INSTALLED packages, so functions are exercised on every OS, not just loaded.
name: install-check

on:
  push:
    branches: [master, dev]   # NOTE: 'dev' is temporary while CI is being set up. Remove before the final merge to master.
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  install:
    runs-on: ${{ matrix.os }}
    name: install.R on ${{ matrix.os }}
    timeout-minutes: 120   # a cold Bioconductor install is slow
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    env:
      # For pull requests github.head_ref is the source branch; for pushes use ref_name.
      LATELIER_REF: ${{ github.head_ref || github.ref_name }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      # System libraries a user must install themselves; install.R cannot do this.
      # Keep this list in sync with the system-dependency table in INSTALL.md.
      # Start minimal and add libraries only when a CI failure shows they are needed.
      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Run install.R (HORIZON + GAIA, no optional groups)
        shell: Rscript {0}
        run: |
          options(latelier.packages = c("HORIZON", "GAIA"),
                  latelier.optional = "none",
                  latelier.ref      = Sys.getenv("LATELIER_REF"))
          source("install.R")

      # install.R reports failures but does not stop, so fail the job explicitly.
      - name: Check both packages load
        shell: Rscript {0}
        run: |
          ok <- vapply(c("HORIZON", "GAIA"), requireNamespace, logical(1), quietly = TRUE)
          print(ok)
          if (!all(ok)) stop("Package(s) failed to install: ",
                             paste(names(ok)[!ok], collapse = ", "))

      # Runs real workflows from the installed packages (HORIZON output -> GAIA
      # analysis) on this OS. Simulated data only; no external tools needed.
      - name: Integration tests (HORIZON -> GAIA) on the installed packages
        shell: Rscript {0}
        run: source("tests/integration/run_integration.R")
