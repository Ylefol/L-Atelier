# =============================================================================
# Shiny Workflow Builder — Config Structure Example
# =============================================================================
# This file illustrates the config format used by the Shiny app to describe
# toolkit functions, their pipeline state types, and their parameters.
#
# See: to_process/shiny_app_design_summary_v2.md for full design context.
#
# Naming convention for types: {omics}_{state}
#   e.g. rnaseq_raw, rnaseq_normalized, atacseq_peaks, result_differential
# =============================================================================


# =============================================================================
# Pipeline State Vocabulary
# ---------------------------------------------------------------------------
# All valid pipeline states. Every function input/output must reference
# a type defined here. Never use ad-hoc type strings in function definitions.
#
# Adding a new type is a deliberate decision — ask: is this genuinely a new
# pipeline state, or is it the same as an existing one with a different name?
# =============================================================================
types:
  raw_counts:
    description: "Unprocessed count matrix, not yet normalized"
  normalized_counts:
    description: "Normalized count matrix, ready for statistical analysis"
  differential_result:
    description: "Output of a differential expression or accessibility test"
  enrichment_result:
    description: "Output of pathway or gene set enrichment analysis"


# =============================================================================
# Function Definitions
# ---------------------------------------------------------------------------
# Each entry maps one toolkit function to its pipeline metadata.
# The key (e.g. function_1) must match the exact R function name.
#
# Fields:
#   label       — human-readable name shown in the UI
#   description — brief description shown in the UI
#   input       — list of pipeline state types this function accepts as input
#                 use [] for source nodes (data loading functions)
#   output      — pipeline state type this function produces
#   parameters  — user-facing parameters exposed in the parameter dialog
#     name        R parameter name (must match function signature exactly)
#     label       human-readable name
#     type        one of: numeric, integer, character, logical, select, file
#     default     default value (null if required with no default)
#     options     list of valid values (select type only)
#     description optional tooltip/hint shown to the user
#   hidden      — R parameter names to suppress from the UI entirely
#                 (e.g. verbose, output_dir, prefix, save_rds, save_plots)
#                 A global blocklist covers most cases; per-function hidden
#                 is for anything extra.
# =============================================================================
functions:

  function_1:
    label: "Load Raw Counts"
    description: "Imports a raw count matrix from file"
    input: []                  # source node — no upstream dependency
    output: raw_counts
    parameters:
      - name: file_path
        label: "Count matrix file"
        type: file
        default: null
        description: "Path to counts CSV or TSV"
      - name: sep
        label: "Delimiter"
        type: select
        default: ","
        options: [",", "\t"]
        description: "Column separator in the input file"
    hidden: [verbose]

  function_2:
    label: "Normalize Counts"
    description: "Normalizes a raw count matrix"
    input: [raw_counts]
    output: normalized_counts
    parameters:
      - name: method
        label: "Normalization method"
        type: select
        default: "TMM"
        options: ["TMM", "CPM", "quantile"]
        description: "Normalization strategy to apply"
    hidden: [verbose, output_dir]

  function_3:
    label: "Differential Expression"
    description: "Tests for differential expression between conditions"
    input: [normalized_counts]
    output: differential_result
    parameters:
      - name: alpha
        label: "Significance threshold"
        type: numeric
        default: 0.05
        description: "Adjusted p-value cutoff"
      - name: lfc_threshold
        label: "Log2 fold-change threshold"
        type: numeric
        default: 1.0
        description: "Minimum absolute LFC to consider significant"
    hidden: [verbose, output_dir, save_rds]

  function_4:
    label: "Pathway Enrichment"
    description: "Gene set enrichment on normalized data"
    input: [normalized_counts]
    output: enrichment_result
    parameters:
      - name: database
        label: "Gene set database"
        type: select
        default: "HALLMARK"
        options: ["HALLMARK", "KEGG", "GO_BP"]
        description: "Which gene set collection to use"
    hidden: [verbose, output_dir]
